name: Recovery fastbootd audit

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'Temporary HTTPS URL to the exact recovery.img to audit'
        required: true
        type: string
      PATCH_MODE:
        description: 'audit only reports findings; apply creates an explicitly unverified candidate'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      ALLOW_UNVERIFIED_CANDIDATE:
        description: 'Required for apply; candidate is not signed by Samsung AVB key and is not flash-ready'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes lz4

      - name: Download and identify recovery image
        env:
          RECOVERY_URL: ${{ inputs.RECOVERY_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --retry 3 --retry-all-errors "$RECOVERY_URL" --output recovery.img
          test -s recovery.img
          test "$(dd if=recovery.img bs=8 count=1 status=none)" = 'ANDROID!'
          file recovery.img
          sha256sum recovery.img

      - name: Verify input AVB footer
        run: |
          set -euo pipefail
          python3 avbtool verify_image --image recovery.img

      - name: Prepare boot-image payload
        run: |
          set -euo pipefail
          chmod +x script1.sh magiskboot
          ./script1.sh

      - name: Audit or build an explicitly unverified candidate
        env:
          PATCH_MODE: ${{ inputs.PATCH_MODE }}
          ALLOW_UNVERIFIED_CANDIDATE: ${{ inputs.ALLOW_UNVERIFIED_CANDIDATE }}
        run: |
          set -euo pipefail
          chmod +x script2.sh
          ./script2.sh

      - name: Collect report and opt-in candidate
        if: ${{ always() }}
        env:
          PATCH_MODE: ${{ inputs.PATCH_MODE }}
          ALLOW_UNVERIFIED_CANDIDATE: ${{ inputs.ALLOW_UNVERIFIED_CANDIDATE }}
        run: |
          set -euo pipefail
          mkdir -p output
          test -f patch-report.txt && cp patch-report.txt output/ || true
          if [[ "$PATCH_MODE" == apply && "$ALLOW_UNVERIFIED_CANDIDATE" == true && -s recovery-patched-unsigned.img ]]; then
            cp recovery-patched-unsigned.img output/
            sha256sum output/recovery-patched-unsigned.img > output/recovery-patched-unsigned.img.sha256
            printf '%s\n' 'UNVERIFIED: this candidate is not signed by the stock AVB key and is not flash-ready with stock vbmeta.' > output/README.txt
          fi

      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-fastbootd-audit
          path: output/
          if-no-files-found: warn
