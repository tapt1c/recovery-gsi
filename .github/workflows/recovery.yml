name: Recovery fastbootd audit

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'Temporary HTTPS URL to the exact recovery.img to audit'
        required: true
        type: string
      PATCH_MODE:
        description: 'audit only reports findings; apply creates an explicitly unverified candidate'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
      ALLOW_UNVERIFIED_CANDIDATE:
        description: 'Required for apply; candidate is not signed by Samsung AVB key and is not flash-ready'
        required: true
        default: false
        type: boolean
      AVB_MODE:
        description: 'stock keeps the stock-vbmeta limitation; disable-verification makes a non-exported replacement vbmeta'
        required: true
        default: stock
        type: choice
        options:
          - stock
          - disable-verification
      ALLOW_AVB_DISABLE:
        description: 'Required for disable-verification; this is a security downgrade and never exports firmware'
        required: true
        default: false
        type: boolean
      EXPORT_FIRMWARE_ARTIFACT:
        description: 'Creates a 1-day artifact with patched recovery, replacement vbmeta, and Odin AP tar; never includes the input image'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes lz4

      - name: Download and identify recovery image
        env:
          RECOVERY_URL: ${{ inputs.RECOVERY_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --retry 3 --retry-all-errors "$RECOVERY_URL" --output recovery.img
          test -s recovery.img
          test "$(dd if=recovery.img bs=8 count=1 status=none)" = 'ANDROID!'
          file recovery.img
          sha256sum recovery.img

      - name: Verify input AVB footer
        run: |
          set -euo pipefail
          python3 avbtool verify_image --image recovery.img

      - name: Prepare boot-image payload
        run: |
          set -euo pipefail
          chmod +x script1.sh magiskboot
          ./script1.sh

      - name: Audit or test-build an explicitly unverified candidate
        env:
          PATCH_MODE: ${{ inputs.PATCH_MODE }}
          ALLOW_UNVERIFIED_CANDIDATE: ${{ inputs.ALLOW_UNVERIFIED_CANDIDATE }}
          AVB_MODE: ${{ inputs.AVB_MODE }}
          ALLOW_AVB_DISABLE: ${{ inputs.ALLOW_AVB_DISABLE }}
        run: |
          set -euo pipefail
          chmod +x script2.sh
          ./script2.sh

      - name: Assemble explicitly requested Odin artifact
        if: ${{ success() && inputs.EXPORT_FIRMWARE_ARTIFACT }}
        env:
          PATCH_MODE: ${{ inputs.PATCH_MODE }}
          AVB_MODE: ${{ inputs.AVB_MODE }}
        run: |
          set -euo pipefail
          test "$PATCH_MODE" = apply
          test "$AVB_MODE" = disable-verification
          test -s recovery-patched-unsigned.img
          test -s vbmeta-verification-disabled.img
          mkdir -p firmware-output
          cp recovery-patched-unsigned.img firmware-output/recovery.img
          cp vbmeta-verification-disabled.img firmware-output/vbmeta.img
          tar --format=ustar -C firmware-output -cf firmware-output/Odin_AP_fastbootd_BYG1.tar recovery.img vbmeta.img
          tar -tf firmware-output/Odin_AP_fastbootd_BYG1.tar
          sha256sum firmware-output/recovery.img firmware-output/vbmeta.img firmware-output/Odin_AP_fastbootd_BYG1.tar > firmware-output/SHA256SUMS
          {
            printf 'Input recovery is deliberately excluded.\n'
            printf 'This artifact requires an unlocked bootloader and intentionally disables AVB verification via vbmeta.img.\n'
            printf 'Load Odin_AP_fastbootd_BYG1.tar in Odin AP; do not flash raw images independently.\n'
          } > firmware-output/README.txt

      - name: Collect diagnostic report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p output
          test -f patch-report.txt && cp patch-report.txt output/ || true

      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-fastbootd-audit
          path: output/
          if-no-files-found: warn

      - name: Upload explicitly requested firmware artifact
        if: ${{ success() && inputs.EXPORT_FIRMWARE_ARTIFACT }}
        uses: actions/upload-artifact@v4
        with:
          name: fastbootd-recovery-BYG1-avb-disabled
          path: firmware-output/
          retention-days: 1
          if-no-files-found: error
